name: Python validation

on:
  pull_request:
    branches:
      - feature/persistent-task-management
  push:
    branches:
      - feature/persistent-memory-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py task_store.py memory_store.py test_memory_store.py
      - name: Run memory validation tests
        run: python -m unittest -v test_memory_store
