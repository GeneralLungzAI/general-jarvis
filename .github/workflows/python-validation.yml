name: Python validation

on:
  pull_request:
    branches:
      - feature/persistent-task-management
  push:
    branches:
      - feature/persistent-memory-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: jarvis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jarvis:jarvis_test_password@localhost:5432/jarvis_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py task_store.py memory_store.py test_memory_store.py test_memory_store_integration.py
      - name: Run memory unit and PostgreSQL integration tests
        run: python -m unittest discover -v
